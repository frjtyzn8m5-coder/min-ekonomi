<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vardagshub</title>

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vardagshub" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#070709" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans:    ['Hanken', 'system-ui', 'sans-serif'],
              display: ['Fraunces', 'Georgia', 'serif'],
            },
            colors: {
              // v4 design language — premium dark + warm gold + vibrant data hues
              bg:      '#070709',
              panel:   '#0e0e13',
              card:    '#15151b',
              soft:    '#101016',
              ink:     '#f4f1ea',
              mut:     '#9b9688',
              faint:   '#625d52',
              line:    'rgba(244,241,234,0.09)',
              gold:    { DEFAULT: '#e9c178', 2: '#f4d79a', deep: '#cf9a3f' },
              violet:  '#9b8cff',
              cyan:    '#5fe0d0',
              coral:   '#ff8f7a',
              lime:    '#bfe26a',
              // legacy aliases kept so un-reskinned screens don't crash
              primary: { DEFAULT: '#e9c178', hover: '#f4d79a' },
              surface: { DEFAULT: '#070709', card: '#15151b', border: 'rgba(244,241,234,0.09)' },
            },
          },
        },
      };
    </script>

    <style>
      /* ── Self-hosted type ─────────────────────────────────────────────── */
      @font-face { font-family:'Fraunces'; src:url('/fonts/fraunces.woff2') format('woff2'); font-weight:300 900; font-style:normal; font-display:swap; }
      @font-face { font-family:'Fraunces'; src:url('/fonts/fraunces-italic.woff2') format('woff2'); font-weight:300 900; font-style:italic; font-display:swap; }
      @font-face { font-family:'Hanken';   src:url('/fonts/hanken.woff2') format('woff2'); font-weight:300 800; font-style:normal; font-display:swap; }

      /* ── Design tokens (also available to raw CSS / canvas components) ──── */
      :root {
        --bg:#070709; --panel:#0e0e13; --card:#15151b; --soft:#101016;
        --ink:#f4f1ea; --mut:#9b9688; --faint:#625d52; --line:rgba(244,241,234,.09);
        --gold:#e9c178; --gold2:#f4d79a; --gold-deep:#cf9a3f;
        --violet:#9b8cff; --cyan:#5fe0d0; --coral:#ff8f7a; --lime:#bfe26a;
        --shadow:0 30px 60px -34px rgba(0,0,0,.8);
        --shadow-s:0 12px 26px -16px rgba(0,0,0,.7);
      }

      *, *::before, *::after { font-family:'Hanken', system-ui, sans-serif; }
      body { background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }

      ::-webkit-scrollbar { width:7px; height:7px; }
      ::-webkit-scrollbar-track { background:transparent; }
      ::-webkit-scrollbar-thumb { background:rgba(244,241,234,.14); border-radius:4px; }
      ::-webkit-scrollbar-thumb:hover { background:rgba(244,241,234,.24); }

      /* ── Reusable v4 primitives ───────────────────────────────────────── */
      .font-display { font-family:'Fraunces','Georgia',serif; }
      .tnum { font-variant-numeric:tabular-nums; }

      /* glass card */
      .vh-card {
        background:var(--card); border:1px solid var(--line); border-radius:22px;
        box-shadow:var(--shadow-s); position:relative; overflow:hidden;
        transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s;
      }
      .vh-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
      .vh-card--glass { background:rgba(255,255,255,.045); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
      .vh-card--glass::before { content:""; position:absolute; top:0; left:0; right:0; height:1px;
        background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent); }

      /* clay icon tiles */
      .vh-tile { display:flex; align-items:center; justify-content:center; border-radius:14px; flex:none;
        box-shadow:inset 0 1px 1px rgba(255,255,255,.4), 0 8px 16px -8px rgba(0,0,0,.6); }
      .vh-tile svg { fill:#1a1206; }
      .vh-tile--gold   { background:linear-gradient(160deg,#f4d79a,#d99f3e); }
      .vh-tile--violet { background:linear-gradient(160deg,#c3b8ff,#7b67f0); }
      .vh-tile--cyan   { background:linear-gradient(160deg,#9bf0e4,#34c3b2); }
      .vh-tile--coral  { background:linear-gradient(160deg,#ffc3b6,#f06a52); }
      .vh-tile--lime   { background:linear-gradient(160deg,#dcf0a0,#9ec23e); }

      @media (prefers-reduced-motion: reduce) {
        .vh-card { transition:none; }
      }
    </style>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
